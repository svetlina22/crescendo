    <script type="application/ld+json" id="ld-organization">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://crescendo.bg/#organization",
            "name": "Crescendo",
            "url": "https://crescendo.bg",
            "email": "redakcia@crescendo.bg",
            "description": "Академична платформа за музикално образование."
          },
          {
            "@type": "WebSite",
            "@id": "https://crescendo.bg/#website",
            "url": "https://crescendo.bg",
            "name": "Crescendo",
            "inLanguage": "bg-BG",
            "publisher": { "@id": "https://crescendo.bg/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://crescendo.bg/index.html?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body data-page="home">
    <div id="app" class="d-flex flex-column min-vh-100">
      <div id="header"></div>

      <!-- ═══ РЕДАКТИРАЙТЕ ТЕКСТОВЕТЕ ДИРЕКТНО ТУК ═══ -->
      <main id="page" class="flex-grow-1" data-static="true">

        <!-- Hero: компактен carousel (съдържанието се зарежда от JS) -->
        <section class="hero-compact" aria-label="Водещи материали">
          <div
            id="heroCarousel"
            class="carousel slide hero-carousel"
            data-bs-ride="false"
            data-bs-interval="6500"
            data-bs-pause="hover"
          >
            <div class="carousel-indicators hero-carousel__indicators" id="heroCarouselIndicators"></div>
            <div class="carousel-inner" id="heroCarouselInner"></div>
            <button
              type="button"
              class="carousel-control-prev hero-carousel__control"
              data-bs-target="#heroCarousel"
              data-bs-slide="prev"
            >
              <span class="hero-carousel__control-icon" aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
              <span class="visually-hidden">Предишен слайд</span>
            </button>
            <button
              type="button"
              class="carousel-control-next hero-carousel__control"
              data-bs-target="#heroCarousel"
              data-bs-slide="next"
            >
              <span class="hero-carousel__control-icon" aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
              <span class="visually-hidden">Следващ слайд</span>
            </button>
          </div>
          <div class="container">
            <nav class="hero-rubric-nav" id="heroRubricNav" aria-label="Рубрики в слайдшоуто"></nav>
          </div>
        </section>

        <section class="container py-5" id="articles" aria-label="Публикации и търсене">
          <div class="row g-4 align-items-start">
            <div class="col-lg-8">
              <div id="activeFilterWrap"></div>
              <div id="articlesFeed">
                <div class="text-center text-secondary py-5">
                  <div class="spinner-border spinner-border-sm"></div>
                  <span class="ms-2">Зареждане на статии…</span>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="home-sidebar-sticky">
                <div id="eventsSidebarWrap">
                  <div class="text-center text-secondary py-3"><span class="spinner-border spinner-border-sm"></span></div>
                </div>
                <div class="article-discovery-toolbar">
                  <aside class="sidebar-panel">
                    <h2 class="widget-title">Търсене</h2>
                    <form id="articleSearchForm" role="search">
                      <label for="articleSearchInput" class="visually-hidden">Търсене</label>
                      <div class="input-group">
                        <span class="input-group-text border-0 bg-light"><i class="bi bi-search"></i></span>
                        <input type="search" class="form-control border-0 bg-light" id="articleSearchInput" name="q" placeholder="Ключова дума…" autocomplete="off" />
                      </div>
                    </form>
                  </aside>
                  <div id="tagCloudWrap">
                    <div class="text-center text-secondary py-3"><span class="spinner-border spinner-border-sm"></span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

      </main>
      <div id="footer"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
