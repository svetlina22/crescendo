<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Концерти, конференции и събития в музикалното образование" />
    <title>Събития · Crescendo</title>
  </head>
  <body data-page="events">
    <div id="app" class="d-flex flex-column min-vh-100">
      <div id="header"></div>

      <main id="page" class="flex-grow-1" data-static="true">
        <section class="rubric-hero">
          <div
            class="rubric-hero__photo"
            style="background-image:url('https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&w=1200&h=600&q=80')"
          ></div>
          <div class="rubric-hero__shade"></div>
          <div class="container rubric-hero__content">
            <span class="badge-cat badge-cat--event mb-2">
              <i class="bi bi-calendar-event" aria-hidden="true"></i> Календар
            </span>
            <h1>Събития</h1>
            <p class="lead mb-0">
              Концерти, конференции, семинари и други събития от света на музикалното образование.
            </p>
          </div>
        </section>

        <section class="container pb-5">
          <div id="eventsGrid" class="row g-4">
            <div class="col-12 text-center text-secondary py-4">
              <div class="spinner-border spinner-border-sm"></div>
              <span class="ms-2">Зареждане на събития…</span>
            </div>
          </div>
        </section>
      </main>

      <div id="footer"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
